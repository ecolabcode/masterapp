<div class="page">
  <h2>Stock My Notes</h2>

  <mat-card class="card">
    <h3>{{ editingId() ? 'Edit note' : 'Create note' }}</h3>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Notes</mat-label>
        <textarea matInput rows="5" formControlName="notes"></textarea>
        <mat-hint align="end"> {{ form.controls.notes.value?.length || 0 }} / 1000 </mat-hint>
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="submit">
          {{ editingId() ? 'Update' : 'Create' }}
        </button>
        <button mat-button type="button" *ngIf="editingId()" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </mat-card>

  <div class="grid">
    <mat-card class="note" *ngFor="let n of notes()">
      <b>{{ n.date }}</b>
      <p class="body">{{ n.notes }}</p>

      <div class="note-actions">
        <button mat-button (click)="startEdit(n)">Edit</button>
        <button mat-button color="warn" (click)="remove(n.id)">Delete</button>
      </div>
    </mat-card>
  </div>
</div>
